<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f7fb" />

    <!-- Tema claro por defecto; evita el destello al cargar si el visitante
         eligió el oscuro en una visita anterior. -->
    <script>
      (function () {
        try {
          var guardado = window.localStorage.getItem("dr-tema");
          var oscuro = guardado === "oscuro";
          document.documentElement.dataset.theme = oscuro ? "dark" : "light";
          document.documentElement.style.backgroundColor = oscuro
            ? "#101827"
            : "#f4f7fc";
        } catch (error) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>

    <title>Diego Reyes · Desarrollo Web y Software</title>
